<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foundry Spec Repository Scanning</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <header class="top">
      <a class="brand" href="#/" data-link>
        <span class="brand-lockup" aria-hidden="true">
          <svg class="brand-glyph" viewBox="0 0 40 40" role="img" focusable="false">
            <rect x="2" y="2" width="36" height="36" rx="8" fill="none" stroke="currentColor" stroke-width="2" />
            <path
              d="M10 26V14h6.2c3.1 0 5 1.6 5 4.1 0 1.7-.9 3-2.4 3.6L22.8 26h-3.3l-3.5-4.1H13.2V26H10zm3.2-6.6h2.8c1.4 0 2.2-.7 2.2-1.8s-.8-1.8-2.2-1.8h-2.8v3.6zM25.4 26l4.2-12h3.5L37.3 26h-3.4l-.7-2.2h-4.1L28.4 26h-3zm5.2-4.7h2.7l-1.3-4.1-1.4 4.1z"
              fill="currentColor"
            />
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-mark">Foundry Spec Repository Scanning</span>
          <span class="brand-sub">local appsec</span>
        </span>
      </a>
      <nav class="nav">
        <a href="#/" data-link>Runs</a>
        <a href="#/scan" data-link>New scan</a>
      </nav>
      <div class="header-right">
        <div class="acyl-brand" title="Accelerated Cybersecurity Leadership">
          <span class="acyl-name">ACYL</span>
          <span class="acyl-full">Accelerated Cybersecurity Leadership</span>
        </div>
        <div class="pulse" id="health-pill" title="API health">idle</div>
      </div>
    </header>

    <main id="app" class="shell">
      <p class="loading">Loading…</p>
    </main>

    <footer class="foot">
      <span>Bound to localhost · findings stay on this machine</span>
      <span id="cache-hint"></span>
    </footer>
    <script src="/static/app.js" type="module"></script>
  </body>
</html>
