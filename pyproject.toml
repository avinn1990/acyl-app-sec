[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acyl"
version = "0.1.0"
description = "Personal local AppSec platform: Foundry-lite harness, Antares localization, CodeGuard, secrets/SCA, gated autofix"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "acyl-app-sec contributors" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "fastapi>=0.111",
  "pydantic>=2.7",
]

[project.optional-dependencies]
model = [
  "transformers>=4.44",
  "torch>=2.3",
  "accelerate>=0.33",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
acyl = "acyl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/acyl"]

[tool.hatch.build.targets.wheel.sources]
"src/acyl" = "acyl"

[tool.hatch.build.targets.wheel.force-include]
"goals" = "acyl/goals"

[tool.hatch.build.targets.sdist]
include = ["src/acyl", "rules", "goals", "vendor/codeguard/SHA256SUMS", "specs", "examples", "fixtures", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001", "B008", "B005", "SIM102", "SIM103", "SIM105", "SIM108", "SIM117", "E501", "PYI034"]
